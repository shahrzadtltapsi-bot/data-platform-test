<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Data Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>📊 پیش‌نمایش جدول</h2>
    <div>{{ preview|safe }}</div>

    <h3 class="mt-4">✏️ تغییر نام ستون‌ها</h3>
    <form method="POST">
        {% for col in columns %}
            <div class="mb-2">
                <label>{{ col }}</label>
                <input type="text" name="{{ col }}" value="{{ col }}" class="form-control">
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary mt-3">ذخیره تغییرات</button>
    </form>

</body>
</html>
